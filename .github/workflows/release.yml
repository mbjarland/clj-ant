name: release

# Triggered by pushing a v*.*.* tag. Builds the jar and deploys to
# Clojars. CLOJARS_USERNAME and CLOJARS_PASSWORD secrets must be
# configured as a deploy token scoped to the verified group.

on:
  push:
    tags: ['v*.*.*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: Compile Java bridge
        run: clojure -T:build javac
      - name: Run tests
        run: clojure -M:test
      - name: Deploy to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy
